<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1526"/>
      <stop offset="100%" stop-color="#050A14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2BD75"/>
      <stop offset="50%" stop-color="#C8A45C"/>
      <stop offset="100%" stop-color="#9E7C3B"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12"/>

  <!-- Sun behind Mountain -->
  <circle cx="256" cy="180" r="55" fill="url(#goldGrad)" opacity="0.85"/>

  <!-- Mountain Peak (Kilimanjaro Summit) -->
  <path d="M 90 380 L 256 140 L 422 380 Z" fill="url(#goldGrad)"/>
  <path d="M 256 140 L 422 380 L 256 380 Z" fill="#0B1526" opacity="0.25"/>

  <!-- Snow Cap -->
  <path d="M 256 140 L 210 205 L 235 195 L 256 215 L 280 195 L 302 205 Z" fill="#FFFFFF"/>

  <!-- Compass Star Top Accent -->
  <polygon points="256,45 264,70 289,78 264,86 256,111 248,86 223,78 248,70" fill="url(#goldGrad)"/>
</svg>
